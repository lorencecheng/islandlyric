name: iOS Build (unsigned)

# 免费额度说明：
# - 公共仓库：标准 macOS runner 的分钟数不计量
# - 私有仓库：macOS 任务按 10 倍折算额度
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          echo "---"
          xcodebuild -showsdks | tail -n 20

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          ls -la IslandLyric.xcodeproj

      - name: Build (no code signing)
        run: |
          set -o pipefail
          : > build.log
          xcodebuild \
            -project IslandLyric.xcodeproj \
            -scheme IslandLyric \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a build.log

      - name: Surface compile errors
        if: failure()
        run: |
          grep -E "(error:|BUILD FAILED|The following build commands failed)" build.log | head -n 40 | while IFS= read -r line; do
            echo "::error title=Xcode::$line"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload unsigned app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IslandLyric-unsigned
          path: build/Build/Products/Release-iphoneos/IslandLyric.app
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 状态 | ${{ job.status }} |"
            echo "| Runner | macos-15 |"
            echo "| 签名 | 未签名（仅用于验证能否编译） |"
            echo ""
            echo "<details><summary>build.log 末尾 40 行</summary>"
            echo ""
            echo '```'
            tail -n 40 build.log || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
