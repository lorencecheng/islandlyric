name: IslandLyric
options:
  bundleIdPrefix: com.lorence
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  IslandLyric:
    type: application
    platform: iOS
    sources:
      - path: IslandLyric
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: IslandLyric
        PRODUCT_BUNDLE_IDENTIFIER: com.lorence.islandlyric
        INFOPLIST_FILE: IslandLyric/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: LyricWidget
        embed: true

  LyricWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricWidget
        excludes:
          - "Info.plist"
      - path: IslandLyric/Shared
    settings:
      base:
        PRODUCT_NAME: LyricWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.lorence.islandlyric.widget
        INFOPLIST_FILE: LyricWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  IslandLyric:
    build:
      targets:
        IslandLyric: all
    run:
      config: Debug
    archive:
      config: Release
